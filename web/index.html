<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>XPRNT STIKER IMPOSER</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="bg-blobs" aria-hidden="true"></div>

<header class="topbar">
  <div class="topbar-inner shell-width">
    <div class="brand">
      <svg class="brand-logo" width="34" height="34" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <rect x="2" y="2" width="24" height="24" rx="6" fill="#1a1a1a"/>
        <rect x="7.5" y="7.5" width="13" height="13" rx="2.5" fill="#ffffff"/>
        <rect x="7.5" y="7.5" width="5.5" height="1.7" fill="#1a1a1a"/>
        <rect x="7.5" y="7.5" width="1.7" height="5.5" fill="#1a1a1a"/>
      </svg>
      <h1>XPRNT <span>STIKER IMPOSER</span></h1>
    </div>
  </div>
</header>

<div class="app-shell shell-width">
  <aside class="sidebar">
    <div class="sidebar-title">Типи розкладки</div>
    <button type="button" class="sidebar-tab is-active">Прямокутні наліпки</button>
    <button type="button" class="sidebar-tab" disabled>
      Контур порізки
      <span class="badge">незабаром</span>
    </button>
  </aside>

  <main class="page">
    <div class="layout">
      <section class="col col-form">
        <div class="card steps-card">

          <div class="card-section" id="artwork-section">
            <div class="card-title">1. Артворк (PDF)</div>
            <label class="dropzone" id="dropzone" for="file-input">
              <svg class="dropzone-icon" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M7 18a4 4 0 0 1-.6-7.96A5.5 5.5 0 0 1 17.2 8.02 4.5 4.5 0 0 1 17 17H7z"/>
                <path d="M12 12.5v6"/>
                <path d="M9.3 15 12 12.3 14.7 15"/>
              </svg>
              <span id="dropzone-text">Перетягніть один або кілька PDF сюди, або натисніть, щоб обрати файли</span>
            </label>
            <input type="file" id="file-input" accept="application/pdf" multiple hidden>
            <div class="info-row" id="artwork-info" hidden>
              <div><span class="label">Файл</span><span id="artwork-filename">—</span></div>
              <div><span class="label">Розмір з документа</span><span id="artwork-size">—</span></div>
            </div>
            <div class="field-row" id="size-row" hidden>
              <label>Розмір наклейки, мм</label>
              <div class="pair size-pair">
                <input type="number" id="sticker-w" min="0.1" step="0.1">
                <button type="button" id="lock-toggle" class="lock-btn is-locked" title="Зберігати пропорції" aria-pressed="true" aria-label="Зберігати пропорції">
                  <svg id="lock-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <rect x="5" y="11" width="14" height="9" rx="2"/>
                    <path id="lock-shackle" d="M8 11V7a4 4 0 0 1 8 0v4"/>
                  </svg>
                </button>
                <input type="number" id="sticker-h" min="0.1" step="0.1">
              </div>
            </div>
            <div class="batch-list" id="batch-list" hidden></div>
          </div>

          <div class="card-section is-disabled" id="params-card">
            <div class="card-title">2. Аркуш і розмітка</div>

            <div class="field-row">
              <label for="sheet-select">Аркуш</label>
              <select id="sheet-select"></select>
            </div>
            <div class="field-row" id="custom-sheet-row" hidden>
              <label>Розмір аркуша, мм</label>
              <div class="pair">
                <input type="number" id="sheet-w" min="1" step="0.1">
                <span>×</span>
                <input type="number" id="sheet-h" min="1" step="0.1">
              </div>
            </div>

            <div class="field-row">
              <label for="mark-offset">Відступ мітки від краю аркуша, мм</label>
              <input type="number" id="mark-offset" min="0" step="0.1">
            </div>
            <div class="field-row">
              <label for="field-margin">Відступ поля розкладки від мітки, мм</label>
              <input type="number" id="field-margin" min="0" step="0.1">
            </div>

            <div class="field-row">
              <label for="orientation-select">Орієнтація</label>
              <select id="orientation-select">
                <option value="">Авто</option>
                <option value="WIDE">WIDE</option>
                <option value="TALL">TALL</option>
              </select>
            </div>

            <div class="field-row">
              <label>Сітка (стовпці × рядки)</label>
              <div class="pair">
                <input type="number" id="cols" min="0" step="1" placeholder="авто">
                <span>×</span>
                <input type="number" id="rows" min="0" step="1" placeholder="авто">
              </div>
            </div>

            <div class="field-row">
              <label for="cut-contour-checkbox">Векторний PDF контуру різу (для сторонніх програм)</label>
              <input type="checkbox" id="cut-contour-checkbox">
            </div>
          </div>

          <div class="card-section is-disabled" id="order-card">
            <div class="card-title">3. Замовлення</div>
            <div class="field-row">
              <label for="order-number">Номер замовлення</label>
              <input type="text" id="order-number">
            </div>
            <div class="field-row">
              <label for="material-select">Матеріал</label>
              <select id="material-select"></select>
            </div>
            <div class="field-row" id="material-custom-row" hidden>
              <label for="material-custom">Назва матеріалу</label>
              <input type="text" id="material-custom" placeholder="Свій варіант…">
            </div>
            <div class="field-row">
              <label for="quantity">Кількість наклейок</label>
              <input type="number" id="quantity" min="1" step="1" value="1">
            </div>
          </div>

        </div>
      </section>

      <section class="col col-preview">
        <div class="card preview-card">
          <div class="card-title" id="preview-title">Прев'ю розкладки</div>
          <div id="single-preview-block">
            <button type="button" id="batch-back-btn" class="ghost-btn back-btn" hidden>← До списку файлів</button>
            <div class="preview-head">
              <span id="preview-fit" class="pill"></span>
            </div>
            <div class="preview-canvas">
              <svg id="preview-svg" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet"></svg>
            </div>
            <dl class="preview-stats" id="preview-stats"></dl>
          </div>
          <div id="batch-preview-block" hidden>
            <div class="batch-summary" id="batch-summary"></div>
          </div>
        </div>
      </section>
    </div>

    <div class="action-bar">
      <div id="status" class="status" role="status"></div>
      <div class="btn-group">
        <button id="new-task-btn" class="ghost-btn" hidden>Нове завдання</button>
        <button id="generate-btn" class="primary-btn" disabled>Згенерувати та завантажити</button>
      </div>
    </div>
  </main>
</div>

<script src="app.js"></script>
</body>
</html>
